<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NK Tegenwind</title>
<meta name="theme-color" content="#eaf1f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NK Tegenwind">
<style>
  :root {
    --mist:#eaf1f5; --card:#ffffff; --sea:#0e4a66; --sea2:#1c6f93; --foam:#cfe3ec;
    --ink:#10283a; --muted:#5f7584; --line:#e1e9ee; --sand:#f6ecdc;
    --signal:#e8590c; --signal-soft:#fff0e6; --kans:#0e4a66; --weer:#9cc7da;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--mist); color:var(--ink);
         font:16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width:560px; margin:0 auto; padding:18px 16px 44px; }

  header { display:flex; align-items:center; gap:12px; }
  .logo { width:44px; height:44px; border-radius:12px; background:var(--sea); display:grid; place-items:center; flex:none; }
  header h1 { font-size:20px; margin:0; letter-spacing:-.01em; }
  header .sub { margin-top:1px; }
  .sub { color:var(--muted); font-size:13.5px; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:650; padding:3px 9px;
          border-radius:99px; background:var(--signal-soft); color:var(--signal); margin-left:6px; vertical-align:2px; }

  .hero { margin-top:16px; border-radius:22px; padding:20px; color:#fff; position:relative; overflow:hidden;
          background:linear-gradient(150deg, #1c6f93 0%, #0e4a66 70%); }
  .hero.hot { background:linear-gradient(150deg, #f08a3e 0%, #d9480f 75%); }
  .hero .waves { position:absolute; right:-10px; bottom:-6px; opacity:.16; }
  .hero .label { font-size:13.5px; opacity:.85; }
  .hero .big { font-size:64px; font-weight:750; letter-spacing:-.04em; line-height:1; margin:6px 0 4px; }
  .hero .when { font-size:15px; opacity:.95; }
  .hero .stats { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .stat { background:rgba(255,255,255,.16); border-radius:14px; padding:9px 12px; display:flex; align-items:center; gap:9px; }
  .stat b { font-size:17px; display:block; line-height:1.1; }
  .stat span { font-size:12px; opacity:.85; }

  .card { background:var(--card); border-radius:20px; padding:6px 16px; margin-top:14px;
          box-shadow:0 1px 0 rgba(16,40,58,.04), 0 6px 20px -12px rgba(16,40,58,.18); }
  .card h2 { font-size:14px; font-weight:650; color:var(--muted); margin:12px 0 2px; letter-spacing:.01em; }

  .row { display:grid; grid-template-columns:50px 40px 1fr 46px; gap:10px; align-items:center;
         padding:11px 0; border-top:1px solid var(--line); cursor:pointer; }
  .row:first-of-type { border-top:0; }
  .row.we { background:linear-gradient(90deg, var(--sand), rgba(246,236,220,0) 60%); margin:0 -16px; padding-left:16px; padding-right:16px; }
  .day b { display:block; font-size:15px; }
  .day small { color:var(--muted); font-size:12.5px; }
  .compass { width:40px; height:40px; position:relative; }
  .compass svg { position:absolute; inset:0; }
  .meta { min-width:0; }
  .chips { display:flex; gap:6px; align-items:center; margin-bottom:6px; font-size:12.5px; color:var(--muted); }
  .bft { font-weight:700; font-size:12px; padding:2px 7px; border-radius:7px; color:#fff; }
  .head { color:var(--signal); font-weight:650; }
  .bar { position:relative; height:8px; background:#edf3f6; border-radius:99px; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:99px; }
  .bar .w { background:var(--weer); }
  .bar .n { background:var(--kans); }
  .row.hot .bar .n { background:var(--signal); }
  .pct { text-align:right; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  .row.hot .pct { color:var(--signal); }
  .detail { grid-column:1/-1; font-size:13.5px; color:var(--muted); display:none; padding:0 0 2px; }
  .row.open .detail { display:block; }
  .legend { display:flex; gap:16px; font-size:12.5px; color:var(--muted); padding:10px 0 12px; border-top:1px solid var(--line); }
  .legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; background:var(--c); }

  .push { padding:16px; }
  button { font:inherit; font-weight:650; border:0; border-radius:14px; padding:14px 16px; width:100%;
           background:var(--sea); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  button.ghost { background:#e6eff4; color:var(--sea); margin-top:8px; }
  button:disabled { opacity:.6; }
  textarea { width:100%; height:96px; margin-top:10px; font:11.5px/1.4 ui-monospace, Menlo, monospace;
             border:1px solid var(--line); border-radius:12px; padding:10px; background:#f7fafc; color:var(--ink); }
  .hide { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="23" r="5"/><circle cx="24" cy="23" r="5"/>
        <path d="M8 23l5-9h8l3 9M13 14l4 9h-9M19 9h3l-1 5"/>
        <circle cx="17.5" cy="6" r="1.8" fill="#fff" stroke="none"/>
        <path d="M2 9h6M1 13h5" stroke-width="1.6" opacity=".7"/>
      </svg>
    </div>
    <div>
      <h1>NK Tegenwind <span id="storm" class="pill hide">● stormstand</span></h1>
      <div class="sub" id="updated">Laden…</div>
    </div>
  </header>

  <section class="hero" id="hero">
    <svg class="waves" width="220" height="120" viewBox="0 0 220 120" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
      <path d="M10 40c20-14 40-14 60 0s40 14 60 0 40-14 60 0"/>
      <path d="M30 75c20-14 40-14 60 0s40 14 60 0 40-14 60 0"/>
      <path d="M0 110c20-14 40-14 60 0s40 14 60 0 40-14 60 0"/>
    </svg>
    <div class="label">Hoogste kans dat het NK doorgaat</div>
    <div class="big" id="topPct">–</div>
    <div class="when" id="topDay"></div>
    <div class="stats" id="topStats"></div>
  </section>

  <section class="card">
    <h2>Komende 2 weken op de Oosterscheldekering</h2>
    <div id="list"></div>
    <div class="legend">
      <span style="--c:var(--kans)">Kans dat het NK doorgaat</span>
      <span style="--c:var(--weer)">Weerkans</span>
    </div>
  </section>

  <section class="card push" id="push">
    <button id="enable">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span>Meldingen aan</span>
    </button>
    <button id="test" class="ghost hide">Testmelding op dit toestel</button>
    <div id="iosHint" class="sub hide" style="margin-top:10px">Op iPhone: deel-knop, Zet op beginscherm, en open NK Tegenwind vanaf daar.</div>
    <div id="codeBox" class="hide">
      <div class="sub" style="margin-top:12px">Jouw toestelcode</div>
      <textarea id="code" readonly></textarea>
      <button id="copy" class="ghost">Kopieer code</button>
    </div>
  </section>
</main>

<script>
const VAPID_PUBLIC = "BLRz0c47wljK-arB1G-e1tB8_58RurStkT2UDOxUN0y6HInjPF4rqs18xE29eq66LiXXyYahWXc3jw7I33embu8";
const DAGEN = ["zo","ma","di","wo","do","vr","za"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const BFT_KLEUR = ["#8fb8c9","#8fb8c9","#7fb3c6","#5fa8b8","#3f9aa4","#2a8c8a","#d4a017","#e8590c","#d9480f","#c92a2a","#a61e4d","#862e9c","#5f3dc4"];
const $ = id => document.getElementById(id);
const nl = x => String(x).replace(".", ",");
const tegenwind = deg => deg >= 165 && deg <= 265;

function fmt(iso) {
  const d = new Date(iso + "T12:00:00");
  return { dag: DAGEN[d.getDay()], datum: d.getDate() + " " + MAANDEN[d.getMonth()], we: d.getDay() % 6 === 0 };
}

// Kompas: de pijl wijst waar de wind naartoe waait, de letter toont waar hij vandaan komt.
function compass(deg, size, light) {
  const c = light ? "#fff" : "#0e4a66", ring = light ? "rgba(255,255,255,.45)" : "#d6e4eb";
  const rot = (deg + 180) % 360;
  return `<svg width="${size}" height="${size}" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17" fill="none" stroke="${ring}" stroke-width="2"/>
    <text x="20" y="8.5" text-anchor="middle" font-size="6.5" font-weight="700" fill="${ring}">N</text>
    <g transform="rotate(${rot} 20 20)">
      <path d="M20 8 L26 24 L20 20.5 L14 24 Z" fill="${c}"/>
      <path d="M20 21 L20 31" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </svg>`;
}

function bftChip(b) { return `<span class="bft" style="background:${BFT_KLEUR[b] || BFT_KLEUR[12]}">${b} Bft</span>`; }

async function load() {
  try {
    const data = await fetch("data.json?" + Date.now()).then(r => r.json());
    const u = new Date(data.updated);
    $("updated").textContent = "Bijgewerkt " + u.toLocaleString("nl-NL", { weekday:"long", hour:"2-digit", minute:"2-digit" })
      + (data.in_season ? "" : " · buiten seizoen") + (data.held ? " · NK dit seizoen al verreden" : "");
    $("storm").classList.toggle("hide", !data.storm_mode);
    const today = new Date().toISOString().slice(0, 10);
    const days = data.days.filter(d => d.date >= today);
    const top = days.reduce((a, b) => (b.nk > a.nk ? b : a), days[0]);
    const windiest = days.reduce((a, b) => ((b.bft ?? 0) > (a.bft ?? 0) ? b : a), days[0]);
    const focus = top.nk >= 5 ? top : windiest;
    const t = fmt(focus.date);

    $("topPct").textContent = top.nk + "%";
    $("hero").classList.toggle("hot", top.nk >= 50);
    $("topDay").textContent = top.nk >= 5 ? `${t.dag} ${t.datum}` : `Geen storm in zicht · meeste wind ${t.dag} ${t.datum}`;
    if (focus.bft !== undefined) {
      $("topStats").innerHTML = `
        <div class="stat"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>
          <div><b>${focus.bft} Bft</b><span>${nl(focus.wind_med)} m/s gemiddeld</span></div></div>
        <div class="stat">${compass(focus.dir, 26, true)}
          <div><b>${focus.dir_label}</b><span>${tegenwind(focus.dir) ? "pal tegen op de kering" : "geen tegenwind"}</span></div></div>`;
    }

    $("list").innerHTML = days.map(d => {
      const f = fmt(d.date);
      const hasWind = d.bft !== undefined;
      return `<div class="row ${f.we ? "we" : ""} ${d.nk >= 50 ? "hot" : ""}" onclick="this.classList.toggle('open')">
        <div class="day"><b>${f.dag}</b><small>${f.datum}</small></div>
        <div class="compass">${hasWind ? compass(d.dir, 40, false) : ""}</div>
        <div class="meta">
          <div class="chips">${hasWind ? bftChip(d.bft) + `<span>${d.dir_label}</span>` + (tegenwind(d.dir) && d.bft >= 6 ? `<span class="head">tegenwind</span>` : "") : ""}</div>
          <div class="bar"><i class="w" style="width:${d.weer}%"></i><i class="n" style="width:${d.nk}%"></i></div>
        </div>
        <div class="pct">${d.nk}%</div>
        <div class="detail">Weerkans ${d.weer}% · gemiddeld ${nl(d.wind_med)} m/s${hasWind ? `, in de stormachtigste 10% van de voorspellingen ${d.bft_p90} Bft` : ""}</div>
      </div>`;
    }).join("");
  } catch (e) {
    $("updated").textContent = "Nog geen gegevens beschikbaar.";
  }
}

function b64ToBytes(s) {
  const p = "=".repeat((4 - s.length % 4) % 4);
  const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function showCode(sub) {
  $("code").value = JSON.stringify(sub);
  $("codeBox").classList.remove("hide");
  $("test").classList.remove("hide");
  $("enable").querySelector("span").textContent = "Meldingen staan aan";
}

async function setupPush() {
  const isIOS = /iPhone|iPad/.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
    $("enable").disabled = true;
    if (isIOS && !standalone) $("iosHint").classList.remove("hide");
    else $("enable").querySelector("span").textContent = "Meldingen niet beschikbaar in deze browser";
    return;
  }
  const reg = await navigator.serviceWorker.register("sw.js");
  const existing = await reg.pushManager.getSubscription();
  if (existing) showCode(existing);
  $("enable").onclick = async () => {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { $("enable").querySelector("span").textContent = "Meldingen geweigerd in instellingen"; return; }
    const sub = existing || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
    showCode(sub);
  };
  $("test").onclick = () => reg.showNotification("NK Tegenwind", { body: "Meldingen werken op dit toestel.", icon: "icon-192.png" });
  $("copy").onclick = () => { navigator.clipboard.writeText($("code").value); $("copy").textContent = "Gekopieerd"; };
}

load();
setupPush();
</script>
</body>
</html>
