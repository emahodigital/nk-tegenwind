name: Nieuwsmelder

on:
  schedule:
    - cron: "*/15 * * * *"   # elke 15 minuten; doet alleen echt werk bij storm in zicht en om 07.00 uur
  workflow_dispatch:
    inputs:
      mode:
        description: "run (nu kijken)"
        default: run

permissions:
  contents: write

concurrency:
  group: repo-schrijven
  cancel-in-progress: false

jobs:
  nieuws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pywebpush
      - name: Nieuws en inschrijving checken
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python engine/nieuws.py ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'scheduled' }}
      - name: Opslaan
        run: |
          git config user.name "nk-tegenwind-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/nieuws.json engine/nieuws_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Nieuws bijgewerkt" && git pull --rebase && git push)
